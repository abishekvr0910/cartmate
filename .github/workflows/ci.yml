name: CartMate CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cartmate-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Compile and test backend with isolated SQLite database
        working-directory: backend
        env:
          # Legacy demo-session/OTP fixtures require local development mode.
          # Deployed staging and production behavior is covered by subprocess tests.
          CARTMATE_ENV: development
          CARTMATE_DATABASE_PATH: ${{ runner.temp }}/cartmate-ci-tests.db
          OTP_PROVIDER: console
        run: |
          python -m py_compile database.py main.py models.py storage.py sos_providers.py auth_providers.py
          python -m pytest -p no:cacheprovider -q

      - name: Exercise backup and offline restore drill
        run: python -m pytest ops/test_disaster_recovery.py -p no:cacheprovider -q

      - name: Exercise operator preflight checks and contract tests
        run: python -m pytest ops/test_pilot_preflight.py -p no:cacheprovider -q

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Typecheck and build frontend
        working-directory: frontend
        run: npm run build

      - name: Install isolated browser-test dependencies
        run: |
          npm ci --prefix qa
          npm exec --prefix qa -- playwright install --with-deps chromium

      - name: Run desktop and mobile browser journeys against disposable local database
        env:
          CARTMATE_ENV: development
          CARTMATE_E2E_ISOLATED: '1'
          CARTMATE_DATABASE_PATH: ${{ runner.temp }}/cartmate-e2e.db
          CARTMATE_FRONTEND_DIST: ${{ github.workspace }}/frontend/dist
          CARTMATE_MODERATOR_USER_IDS: usr_zuzanna
          CARTMATE_BASE_URL: http://127.0.0.1:8765
          OTP_PROVIDER: console
          SOS_PROVIDER: disabled
        run: |
          set -euo pipefail
          python -m uvicorn main:app --app-dir backend --host 127.0.0.1 --port 8765 --log-level warning --no-access-log &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8765/api/health; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --output /dev/null http://127.0.0.1:8765/api/health
          npm --prefix qa test

      - name: Run no-demo staging-style browser journey on desktop and mobile
        working-directory: qa
        run: npm run test:no-demo

      - name: Run operator-pilot staging browser journey on desktop and mobile
        working-directory: qa
        run: npm run test:operator-pilot

      - name: Run independent private-pilot diagnostic probe
        run: python qa/codex_private_pilot_probe.py

      - name: Run independent recovery-boundary diagnostic probe
        run: python qa/codex_recovery_boundary_probe.py

      - name: Run independent client configuration diagnostic probe
        run: node qa/codex_mvp_config_probe.cjs

      - name: Run independent real-API preflight diagnostic probe
        run: python qa/codex_mvp_preflight_probe.py

      - name: Run independent reconnect missed-message diagnostic probe
        run: node qa/codex_mvp_reconnect_probe.cjs

      - name: Build Render staging image
        run: docker build --file Dockerfile --tag cartmate-staging-ci .

      - name: Smoke-test the built image (REST + WS)
        run: |
          set -euo pipefail
          docker run -d --name cartmate-smoke -p 127.0.0.1:8901:10000 \
            -e PORT=10000 \
            -e CARTMATE_ENV=staging \
            -e CARTMATE_DEPLOYMENT=1 \
            -e SOS_WEBHOOK_SECRET=ci-smoke-secret-not-for-prod \
            -e CARTMATE_DATABASE_PATH=/tmp/cartmate-smoke.db \
            -e OTP_PROVIDER=console \
            -e CARTMATE_STAGING_ALLOWED_PHONES=+48555123456 \
            cartmate-staging-ci
          trap 'docker rm -f cartmate-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8901/api/health; then break; fi
            sleep 1
          done
          curl --fail --silent --output /dev/null http://127.0.0.1:8901/api/health
          # WS smoke: the built image must be ABLE to serve WebSocket upgrades.
          # Empirically (2026-09-29): WS library present + invalid ticket -> handshake
          # rejected with HTTP 403 (FastAPI closes with policy violation before accept).
          # WS library absent (the P0-1 failure mode) -> HTTP 404 "Unsupported upgrade
          # request". So 403 is the PASS condition: the realtime layer is alive and
          # correctly refusing an unauthorized ticket. Full authenticated WS journeys
          # are covered by the Playwright suites, not this smoke.
          python - <<'EOF' || exit 1
          import websockets.exceptions
          import asyncio, websockets

          async def main():
              try:
                  async with websockets.connect("ws://127.0.0.1:8901/ws?ticket=ci-smoke-invalid") as ws:
                      await asyncio.wait_for(ws.recv(), timeout=5)
              except websockets.exceptions.InvalidStatus as e:
                  code = e.response.status_code
                  if code == 403:
                      print("WS smoke PASS: upgrade handled (403 on invalid ticket as designed)")
                      return
                  raise SystemExit(f"WS smoke FAIL: handshake returned HTTP {code}; 404 means the image lacks a WebSocket library (P0-1 regression)")
              raise SystemExit("WS smoke FAIL: server accepted an invalid ticket")

          asyncio.run(main())
          EOF
